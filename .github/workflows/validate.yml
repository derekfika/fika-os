name: FIKA validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.scope.outputs.apps }}
      hub: ${{ steps.scope.outputs.hub }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/workflow/cli.mjs affected --base "$BASE" --head "$HEAD" --output /tmp/fika-scope.json
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("/tmp/fika-scope.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,`apps=${JSON.stringify(v.apps)}\nhub=${v.apps.includes("hub")}\n`);'
          git diff --check "$BASE" "$HEAD"
          if ! git diff --name-only "$BASE" "$HEAD" | grep -qx 'CHANGELOG.md'; then echo 'Every implementation PR must update CHANGELOG.md'; exit 1; fi
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: git config --global user.name 'FIKA workflow tests' && git config --global user.email 'workflow-tests@example.invalid'
      - run: node --test tools/workflow/*.test.mjs
  applications:
    needs: scope
    if: needs.scope.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.scope.outputs.apps) }}
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: demo-fika-os
      FIKA_CPU_PLAN_STORE: memory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Java for CPU route persistence emulator
        if: matrix.app == 'cpu'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Firebase CLI for CPU route persistence emulator
        if: matrix.app == 'cpu'
        run: npm install --global firebase-tools@15.30.2
      - id: app
        env:
          APP: ${{ matrix.app }}
        run: node --input-type=module -e 'import fs from "node:fs";import {APPS} from "./tools/workflow/policy.mjs";fs.appendFileSync(process.env.GITHUB_OUTPUT,`path=${APPS[process.env.APP].path}\n`);'
      - run: npm ci
      - run: npm ci --prefix '${{ steps.app.outputs.path }}'
      - run: npm --prefix '${{ steps.app.outputs.path }}' test
      - run: npm --prefix '${{ steps.app.outputs.path }}' run typecheck
      - run: npm --prefix '${{ steps.app.outputs.path }}' run build
        env:
          NODE_ENV: production
  hub-emulator:
    needs: scope
    if: needs.scope.outputs.hub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm ci --prefix apps/integration-hub && npm install --global firebase-tools@15.30.2
      - run: firebase emulators:exec --only firestore --project demo-fika-os --config tools/workflow/emulator.json 'cd apps/integration-hub && npx tsx --test --test-concurrency=1 tests/booking-cutoffs.emulator.test.ts'
        env:
          FIREBASE_PROJECT_ID: demo-fika-os
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8292
          FIKA_CUTOFF_EMULATOR_TEST: 'true'
          FIKA_CPU_PLAN_STORE: memory
  merge-gate:
    name: Workflow / merge-gate
    if: always()
    needs: [scope, tooling, applications, hub-emulator]
    runs-on: ubuntu-latest
    steps:
      - name: Explicit success, failure or intentional skip
        env:
          SCOPE: ${{ needs.scope.result }}
          TOOLING: ${{ needs.tooling.result }}
          APPS: ${{ needs.applications.result }}
          EMULATOR: ${{ needs.hub-emulator.result }}
        run: |
          test "$SCOPE" = success && test "$TOOLING" = success
          case "$APPS" in success|skipped) ;; *) exit 1;; esac
          case "$EMULATOR" in success|skipped) ;; *) exit 1;; esac
