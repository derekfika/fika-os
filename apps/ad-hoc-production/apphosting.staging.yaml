# Firebase App Hosting staging configuration for Ad-Hoc Production.
# Configure the backend root directory as apps/ad-hoc-production.
# Backend ID is intentionally not declared here; proposed name:
# fika-ad-hoc-production-staging
env:
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability:
      - BUILD
      - RUNTIME
  # Ad-Hoc reaches the Integration Hub only over authenticated HTTP. Identity and
  # AUTHMOD scope come from the caller's own session (forwarded cookie); the
  # shared service token authorises privileged order operations and is a secret.
  - variable: FIKA_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability:
      - RUNTIME
  - variable: FIKA_INTERNAL_API_TOKEN
    secret: FIKA_INTERNAL_API_TOKEN@3
    availability:
      - RUNTIME
