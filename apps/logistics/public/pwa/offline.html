<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FIKA OS · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: Arial, sans-serif; background: #ffffff; color: #1d1647; }
    main { max-width: 360px; text-align: left; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.45; margin: 0 0 20px; color: #4a4566; }
    button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: #4f34c7; color: #ffffff; font-size: 16px; font-weight: 700; }
    button:focus-visible { outline: 3px solid #1d1647; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>Driver data isn’t shown offline, so you never see out-of-date work. Reconnect, then reopen the app to load your current run.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
