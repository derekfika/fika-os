# Firebase App Hosting PRODUCTION configuration for CPU Production.
# Project: fika-os (production). NEVER point this at fika-os-dev. Backend environment name must be 'production'.
# Values marked REPLACE_ME_* are business decisions/infrastructure not created yet; tools/migration/check-production-config.mjs refuses to pass while any remain.
env:
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RUNTIME_MODE
    value: production
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: fika-os
    availability: [BUILD, RUNTIME]
  - variable: FIKA_ALLOWED_EMAIL_DOMAINS
    value: fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_HUB_BASE_URL
    value: https://os.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIKA_HUB_URL
    value: https://os.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: CPU_PRODUCTION_BASE_URL
    value: https://cpu.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: CPU_PUBLIC_BASE_URL
    value: https://cpu.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: MENU_PLANNING_BASE_URL
    value: https://menuplanner.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: DELIVERED_IN_GRAB_AND_GO_API_URL
    value: https://delivered-in.fikacatering.com/api/delivered-in/grab-and-go/production
    availability: [RUNTIME]
  - variable: HOSPITALITY_BOOKING_BASE_URL
    value: https://hospitality.fikacatering.com
    availability: [BUILD, RUNTIME]
  # optional because the adapter resolves the default CPU Production path.
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_APP_CPU_PRODUCTION
    value: REPLACE_ME_PRODUCTION_CPU_DRIVE_OWNER_EMAIL
    availability: [RUNTIME]
  - variable: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    secret: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    availability: [RUNTIME]
  - variable: FIKA_PDF_RENDERER_URL
    value: REPLACE_ME_PRODUCTION_PDF_RENDERER_URL
    availability: [RUNTIME]
  - variable: FIKA_PDF_RENDERER_TOKEN
    secret: FIKA_PDF_RENDERER_TOKEN
    availability: [RUNTIME]
  - variable: FIKA_APP_DELIVERED_IN_URL
    value: https://delivered-in.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_LOGISTICS_BASE_URL
    value: https://logistics.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_INTERNAL_API_TOKEN
    secret: FIKA_INTERNAL_API_TOKEN@1
    availability: [RUNTIME]
  - variable: FIKA_SNAPSHOT_BUCKET
    value: fika-os-prod-read-packages-europe-west4
    availability: [RUNTIME]
