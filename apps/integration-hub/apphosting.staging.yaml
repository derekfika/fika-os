# Firebase App Hosting staging configuration for the Integration Hub.
# Configure the backend root directory as apps/integration-hub.
env:
  - variable: FIKA_HOT_FORK_BUFFET_SELECTOR_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: RCOA_DASHBOARD_BRIDGE_TOKEN
    secret: RCOA_DASHBOARD_BRIDGE_TOKEN
    availability:
      - RUNTIME
  # Read-only canonical booking contract consumed by Hospitality after the
  # Gallagher PIN gate. Same per-environment value in both runtimes.
  - variable: GALLAGHER_DASHBOARD_BRIDGE_TOKEN
    secret: GALLAGHER_DASHBOARD_BRIDGE_TOKEN
    availability: [RUNTIME]
  # Manual lifecycle UAT only. Runtime Booking IDs must be explicitly selected
  # before enabling delivery; a missing selection fails closed for all candidates.
  - variable: FIKA_HOSPITALITY_EMAIL_UAT_RECIPIENT
    value: derek@fikacatering.com
    availability:
      - RUNTIME
  - variable: FIKA_MNK_NOTIFICATION_RECIPIENTS
    value: derek@fikacatering.com
    availability:
      - RUNTIME
  - variable: FIKA_HOSPITALITY_EMAIL_SENDERS_JSON
    value: '{"oploc:66e621fa-6e6f-4f46-9aed-462313abbe8f":{"from":"mnk@fikacatering.com","replyTo":"mnk@fikacatering.com","authenticatedAccount":"mnk@fikacatering.com","displayName":"FIKA Hospitality at MNK","verifiedSendAs":true,"enabled":["submitted","confirmed","amended","cancelled"]}}'
    availability:
      - RUNTIME
  - variable: FIKA_HOSPITALITY_EMAIL_DELIVERY_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability:
      - BUILD
      - RUNTIME
  # Keep Firebase's redirect helper on the same origin as the staging Hub.
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: staging-os.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_SNAPSHOT_BUCKET
    value: fika-os-dev-staging-read-packages-europe-west4
    availability:
      - RUNTIME
  # Owner-authorized Beverage OPLOC reads only. Food Data remains explicitly closed.
  - variable: FIKA_BEVERAGE_REFERENCE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: FIKA_BEVERAGE_REFERENCE_AUDIENCE
    value: https://staging-os.fikacatering.com/api/internal/beverage/reference
    availability: [RUNTIME]
  - variable: FIKA_BEVERAGE_REFERENCE_CALLER_SUBJECT
    value: "104628272102873149105"
    availability: [RUNTIME]
  - variable: FIKA_BEVERAGE_REFERENCE_CALLER_EMAIL
    value: beverage-preview-runtime@fika-os-dev.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: FIKA_FOOD_DATA_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: FIKA_ALLOWED_EMAIL_DOMAINS
    value: fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  # External staging access is admitted by exact address, never by the Gmail domain.
  - variable: FIKA_ALLOWED_EMAIL_ADDRESSES
    value: shericebanya@gmail.com
    availability:
      - RUNTIME
  - variable: FIKA_APP_HOSPITALITY_URL
    value: https://hospitality-staging.fikacatering.com/manage
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_APP_CPU_URL
    value: https://cpu-staging.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: CPU_PRODUCTION_BASE_URL
    value: https://cpu-staging.fikacatering.com
    availability:
      - RUNTIME
  - variable: FIKA_APP_LOGISTICS_URL
    value: https://logistics-staging.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_LOGISTICS_BASE_URL
    value: https://logistics-staging.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_APP_MENU_PLANNING_URL
    value: https://menu-planning-staging.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_APP_DELIVERED_IN_URL
    value: https://delivered-in-staging.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_APP_AD_HOC_URL
    value: https://adhoc-staging.fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  # The generated hosted.app origin remains available for backend smoke tests;
  # customer/staff returnTo values use the cookie-compatible custom hostname.
  - variable: FIKA_ALLOWED_APP_ORIGINS
    value: https://cpu-staging.fikacatering.com,https://logistics-staging.fikacatering.com,https://menu-planning-staging.fikacatering.com,https://hospitality-staging.fikacatering.com,https://delivered-in-staging.fikacatering.com,https://adhoc-staging.fikacatering.com,https://fika-hospitality-staging--fika-os-dev.europe-west4.hosted.app,https://fika-cpu-production-staging--fika-os-dev.europe-west4.hosted.app,https://fika-delivered-in-staging--fika-os-dev.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability:
      - BUILD
      - RUNTIME
  - variable: BRIGHTHR_MODE
    value: fixture
    availability:
      - BUILD
      - RUNTIME
  - variable: SQUARE_MODE
    value: fixture
    availability:
      - BUILD
      - RUNTIME
  - variable: MNK_CANON_BRIDGE_TOKEN
    secret: MNK_CANON_BRIDGE_TOKEN
    availability:
      - RUNTIME
  - variable: FIKA_INTERNAL_API_TOKEN
    secret: FIKA_INTERNAL_API_TOKEN@3
    availability:
      - RUNTIME
  - variable: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON_MAILER
    secret: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON_MAILER
    availability:
      - RUNTIME
  - variable: FIKA_DEV_DASHBOARD_GITHUB_TOKEN
    secret: FIKA_DEV_DASHBOARD_GITHUB_TOKEN
    availability:
      - RUNTIME
