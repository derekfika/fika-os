# This backend is a read-only staging presentation. The data API remains
# emulator-only and is also removed from preview routing in proxy.ts.
env:
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability: [BUILD, RUNTIME]
  - variable: FIRESTORE_EMULATOR_HOST
    value: 127.0.0.1:8294
    availability: [RUNTIME]
  - variable: FIKA_BEVERAGE_PREVIEW_ONLY
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_BEVERAGE_PREVIEW_REVIEWER_EMAILS
    value: derek@fikacatering.com
    availability: [RUNTIME]
  - variable: FIKA_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [RUNTIME]
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability: [RUNTIME]
