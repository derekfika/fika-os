  # Hospitality saves quote PDFs to the approved production folders, scoped by OPLOC (same values as the Hub).
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_OPLOC_24A93500_D75D_4FE0_8BEB_672D36F9DA10
    value: seven@fikacatering.com
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_ROOT_FOLDER_ID_OPLOC_24A93500_D75D_4FE0_8BEB_672D36F9DA10
    value: 18dLsE5Xatj5v6BnxOZFVYspJRWPRx5bO
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_OPLOC_BE0BECBE_B6CF_4D7F_9C1E_F36E689FEAB2
    value: rcoa@fikacatering.com
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_ROOT_FOLDER_ID_OPLOC_BE0BECBE_B6CF_4D7F_9C1E_F36E689FEAB2
    value: 1SMd9V_3wTwLAKpXJxj0VacDosRsJBFKR
    availability: [RUNTIME]
  # Gallagher customer-ledger access stays server-side (Secret Manager only;
  # never NEXT_PUBLIC_*). Values differ per environment.
  - variable: GALLAGHER_DASHBOARD_PIN_HASH
    secret: GALLAGHER_DASHBOARD_PIN_HASH
    availability: [RUNTIME]
  - variable: GALLAGHER_DASHBOARD_SESSION_SECRET
    secret: GALLAGHER_DASHBOARD_SESSION_SECRET
    availability: [RUNTIME]
  - variable: GALLAGHER_DASHBOARD_BRIDGE_TOKEN
    secret: GALLAGHER_DASHBOARD_BRIDGE_TOKEN
    availability: [RUNTIME]
  # Dashboard visibility allow-list (exact requester emails, comma separated).
  # Nothing is visible until the account owner approves requesters; unset = fail closed.
  - variable: GALLAGHER_DASHBOARD_APPROVED_REQUESTERS
    secret: GALLAGHER_DASHBOARD_APPROVED_REQUESTERS
    availability: [RUNTIME]
  - variable: GALLAGHER_LEGACY_SHEET_ID
    secret: GALLAGHER_LEGACY_SHEET_ID
    availability: [RUNTIME]
  - variable: GALLAGHER_SHEETS_IMPERSONATED_USER
    secret: GALLAGHER_SHEETS_IMPERSONATED_USER
    availability: [RUNTIME]
  - variable: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    secret: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    availability: [RUNTIME]
  # Approved OAC tablet menu template. Site output folders remain dashboard
  # settings so quote, allergen, and menu artifacts cannot share one root.
  - variable: GOOGLE_MENU_TEMPLATE_ID_ANGEL_COURT
    value: 1bkaXTTCStSDqo_YZOCnTZbHzaAzzzIAWIL6ooS1EEGw
    availability: [RUNTIME]
