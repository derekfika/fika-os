# Firebase App Hosting staging configuration for Hospitality Booking.
# Configure the backend root directory as apps/hospitality-booking.
env:
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability: [BUILD, RUNTIME]
  # All staging Drive work uses the isolated keyless staging service account.
  - variable: FIKA_STAGING_DRIVE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_AUTH_MODE
    value: shared-drive
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_SHARED_DRIVE_ID
    value: 0ALgY_Zkd_k3cUk9PVA
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_EMAIL
    value: fika-staging-drive@fika-os-dev.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_PERMISSION_ID
    value: "110289228770833757986"
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_ROOT_ID
    value: 1B3oV4dmb3UpwTPRDjJ4B0hES1rRL1M5z
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_ALLOWED_PERMISSION_IDS
    value: "110453433265748456567,110289228770833757986"
    availability: [RUNTIME]
  - variable: FIKA_STAGING_DRIVE_PRODUCTION_SENTINEL_IDS
    value: "1uOdUgHQD7O3Op6DzgyslXG3-_aeYRm08,1go9l-3iDEY_g22C_EFsl0GzVIpX9tSyx,1-2Uo7Z3pYNlXvlIBby7qYGGZMtG2ABag,1b1hSZHJMcwCXXwG3wETO9sVcSayCfxVd"
    availability: [RUNTIME]
  - variable: FIKA_ALLOWED_EMAIL_DOMAINS
    value: fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIKA_HOT_FORK_BUFFET_ENABLED
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: CPU_PRODUCTION_BASE_URL
    value: https://cpu-staging.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_MNK_OPLOC_ID
    value: oploc:66e621fa-6e6f-4f46-9aed-462313abbe8f
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RCOA_OPLOC_ID
    value: oploc:be0becbe-b6cf-4d7f-9c1e-f36e689feab2
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_OPLOC_66E621FA_6E6F_4F46_9AED_462313ABBE8F
    value: mnk@fikacatering.com
    availability: [RUNTIME]
  - variable: MNK_CANON_BRIDGE_TOKEN
    secret: MNK_CANON_BRIDGE_TOKEN
    availability: [RUNTIME]
  # Gallagher customer-ledger access stays server-side (Secret Manager only;
  # never NEXT_PUBLIC_*). Values differ per environment.
  - variable: GALLAGHER_DASHBOARD_PIN_HASH
    secret: GALLAGHER_DASHBOARD_PIN_HASH
    availability: [RUNTIME]
  - variable: GALLAGHER_DASHBOARD_SESSION_SECRET
    secret: GALLAGHER_DASHBOARD_SESSION_SECRET
    availability: [RUNTIME]
  # RCoA customer dashboard authentication remains isolated from Gallagher.
  - variable: RCOA_DASHBOARD_PIN_HASH
    secret: RCOA_DASHBOARD_PIN_HASH
    availability: [RUNTIME]
  - variable: RCOA_DASHBOARD_SESSION_SECRET
    secret: RCOA_DASHBOARD_SESSION_SECRET
    availability: [RUNTIME]
  - variable: RCOA_DASHBOARD_BRIDGE_TOKEN
    secret: RCOA_DASHBOARD_BRIDGE_TOKEN
    availability: [RUNTIME]
  - variable: GALLAGHER_DASHBOARD_BRIDGE_TOKEN
    secret: GALLAGHER_DASHBOARD_BRIDGE_TOKEN
    availability: [RUNTIME]
  - variable: GALLAGHER_LEGACY_SHEET_ID
    secret: GALLAGHER_LEGACY_SHEET_ID
    availability: [RUNTIME]
  - variable: GALLAGHER_SHEETS_IMPERSONATED_USER
    secret: GALLAGHER_SHEETS_IMPERSONATED_USER
    availability: [RUNTIME]
  - variable: FIKA_PDF_RENDERER_URL
    value: https://fika-pdf-renderer-staging-6tc4airnza-ez.a.run.app
    availability: [RUNTIME]
  - variable: FIKA_PDF_RENDERER_TOKEN
    secret: FIKA_PDF_RENDERER_TOKEN
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIKA_HUB_URL
    value: https://staging-os.fikacatering.com
    availability: [BUILD, RUNTIME]
