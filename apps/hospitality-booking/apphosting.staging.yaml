# Firebase App Hosting staging configuration for Hospitality Booking.
# Configure the backend root directory as apps/hospitality-booking.
env:
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability: [BUILD, RUNTIME]
  - variable: FIKA_ALLOWED_EMAIL_DOMAINS
    value: fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: CPU_PRODUCTION_BASE_URL
    value: https://cpu-staging.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_MNK_OPLOC_ID
    value: oploc:66e621fa-6e6f-4f46-9aed-462313abbe8f
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RCOA_OPLOC_ID
    value: oploc:be0becbe-b6cf-4d7f-9c1e-f36e689feab2
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_OPLOC_66E621FA_6E6F_4F46_9AED_462313ABBE8F
    value: mnk@fikacatering.com
    availability: [RUNTIME]
  # MNK menu destination (OPLOC-scoped): this site's own Drive owner (above) and its own menu parent folder. Hospitality only; Delivered-In has a separate parent.
  - variable: GOOGLE_MENU_PARENT_FOLDER_ID_OPLOC_66E621FA_6E6F_4F46_9AED_462313ABBE8F
    value: 1RAj7EFDJIcwvMn8fJaw1eDVI5xec0ENC
    availability: [RUNTIME]
  # Approved MNK Google Slides decks (site-scoped): tablet menu and flat/tent label master.
  - variable: GOOGLE_MENU_TEMPLATE_ID_MNK
    value: 1A3xn63KiCrxrnro3SWJO9FdNf2Y_QIrA8rc7V3K8ToE
    availability: [RUNTIME]
  - variable: GOOGLE_MENU_LABEL_TEMPLATE_ID_MNK
    value: 1st025DPvfJ_I6rj8Ad_BguLbpo00GT4bGS0uwCvQfIc
    availability: [RUNTIME]
  - variable: MNK_CANON_BRIDGE_TOKEN
    secret: MNK_CANON_BRIDGE_TOKEN
    availability: [RUNTIME]
  - variable: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    secret: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    availability: [RUNTIME]
  # CPU allergen releases use the shared Drive adapter through this service.
  # The owner is a governed Workspace identity; the DWD credential remains in
  # Secret Manager and is never exposed in repository configuration.
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_APP_CPU_PRODUCTION
    value: derek@fikacatering.com
    availability: [RUNTIME]
  - variable: FIKA_PDF_RENDERER_URL
    value: https://fika-pdf-renderer-staging-6tc4airnza-ez.a.run.app
    availability: [RUNTIME]
  - variable: FIKA_PDF_RENDERER_TOKEN
    secret: FIKA_PDF_RENDERER_TOKEN
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIKA_HUB_URL
    value: https://staging-os.fikacatering.com
    availability: [BUILD, RUNTIME]
  # TEMPORARY (remove before merge): enables the staging-only real-Google live check for exactly one signed-in operator.
  - variable: FIKA_MENU_LIVECHECK_ALLOWED_EMAIL
    value: derek@fikacatering.com
    availability: [RUNTIME]
