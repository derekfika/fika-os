# Firebase App Hosting staging configuration for Standalone Delivered-In.
# Configure the backend root directory as apps/delivered-in.
# The App Hosting backend should be created in europe-west4 for fika-os-dev.
env:
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability: [BUILD, RUNTIME]
  - variable: FIKA_ALLOWED_EMAIL_DOMAINS
    value: fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: INTEGRATION_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_INTEGRATION_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: MENU_PLANNING_BASE_URL
    value: https://menu-planning-staging.fikacatering.com
    availability: [RUNTIME]
  - variable: CPU_PRODUCTION_BASE_URL
    value: https://cpu-staging.fikacatering.com
    availability: [RUNTIME]
  - variable: FIKA_INTERNAL_API_TOKEN
    secret: FIKA_INTERNAL_API_TOKEN@3
    availability: [RUNTIME]
  - variable: FIKA_SNAPSHOT_BUCKET
    value: fika-os-dev-staging-read-packages-europe-west4
    availability: [RUNTIME]
  # Drive DWD credential (the existing Drive one - not the Gmail mailer credential) and the MNK OPLOC-scoped menu destination.
  - variable: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    secret: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_OWNER_EMAIL_OPLOC_66E621FA_6E6F_4F46_9AED_462313ABBE8F
    value: mnk@fikacatering.com
    availability: [RUNTIME]
  # Delivered-In's own MNK menu parent folder (separate from Hospitality's).
  - variable: GOOGLE_MENU_PARENT_FOLDER_ID_OPLOC_66E621FA_6E6F_4F46_9AED_462313ABBE8F
    value: 1OC2LSGyabZx7gLcN88V7y6ly1lK4SiC_
    availability: [RUNTIME]
  # Approved MNK Google Slides decks (site-scoped).
  - variable: GOOGLE_MENU_TEMPLATE_ID_MNK
    value: 1A3xn63KiCrxrnro3SWJO9FdNf2Y_QIrA8rc7V3K8ToE
    availability: [RUNTIME]
  - variable: GOOGLE_MENU_LABEL_TEMPLATE_ID_MNK
    value: 1st025DPvfJ_I6rj8Ad_BguLbpo00GT4bGS0uwCvQfIc
    availability: [RUNTIME]
  # Optional: GOOGLE_DELIVERED_IN_TEMPLATE_ID (generic template for sites without a shared layout; per-OPLOC override GOOGLE_DELIVERED_IN_TEMPLATE_ID_OPLOC_<KEY>).
  # TEMPORARY (remove before merge): enables the staging-only real-Google live check for exactly one signed-in operator.
  - variable: FIKA_MENU_LIVECHECK_ALLOWED_EMAIL
    value: derek@fikacatering.com
    availability: [RUNTIME]
