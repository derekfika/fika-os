# Firebase App Hosting staging configuration for Standalone Delivered-In.
# Configure the backend root directory as apps/delivered-in.
# The App Hosting backend should be created in europe-west4 for fika-os-dev.
env:
  - variable: FIKA_DATA_SOURCE_TRACE
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: FIKA_RUNTIME_MODE
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: fika-os-dev
    availability: [BUILD, RUNTIME]
  - variable: FIKA_ALLOWED_EMAIL_DOMAINS
    value: fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: FIKA_SESSION_COOKIE_DOMAIN
    value: .fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: INTEGRATION_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_INTEGRATION_HUB_BASE_URL
    value: https://staging-os.fikacatering.com
    availability: [BUILD, RUNTIME]
  - variable: MENU_PLANNING_BASE_URL
    value: https://menu-planning-staging.fikacatering.com
    availability: [RUNTIME]
  - variable: CPU_PRODUCTION_BASE_URL
    value: https://cpu-staging.fikacatering.com
    availability: [RUNTIME]
  - variable: FIKA_INTERNAL_API_TOKEN
    secret: FIKA_INTERNAL_API_TOKEN@3
    availability: [RUNTIME]
  - variable: FIKA_SNAPSHOT_BUCKET
    value: fika-os-dev-staging-read-packages-europe-west4
    availability: [RUNTIME]
  # Provision these before enabling generated site menus. The current
  # file-based OAuth implementation is local-only; hosted generation requires
  # the established Workspace DWD integration used by the other apps.
  - variable: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    secret: GOOGLE_WORKSPACE_DWD_SERVICE_ACCOUNT_JSON
    availability: [RUNTIME]
  # Add these non-secret values after manual provisioning. Drive destinations are OPLOC-scoped (no app-wide owner/folder);
  # <KEY> is the OPLOC id without "oploc:", upper-cased, non-alphanumerics as "_" (e.g. 66E621FA_6E6F_4F46_9AED_462313ABBE8F for MNK):
  # GOOGLE_DRIVE_OWNER_EMAIL_OPLOC_<KEY>        explicit Workspace owner DWD impersonates for that site
  # GOOGLE_MENU_PARENT_FOLDER_ID_OPLOC_<KEY>    explicit menu parent folder for that site
  # GOOGLE_MENU_TEMPLATE_ID_MNK                 MNK tablet deck (site-scoped)
  # GOOGLE_MENU_LABEL_TEMPLATE_ID_MNK           MNK label deck (site-scoped)
  # GOOGLE_DELIVERED_IN_TEMPLATE_ID             generic template for sites without a shared layout (optional per-OPLOC override: GOOGLE_DELIVERED_IN_TEMPLATE_ID_OPLOC_<KEY>)
